name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Supersede in-flight runs on the same ref. `uv sync` pulls vllm and its torch
# stack, so a redundant run is expensive (see OS-1 proposal, Risk 3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # The three commands below are exactly what CONTRIBUTING.md tells a
      # contributor to run locally, so a green local run means a green CI run.
      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/
