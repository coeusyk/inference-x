models:
  # gpu_memory_utilization: auto — (vram_free - buffer) / vram_total at startup (DEC-035).
  # max_model_len caps KV cache pre-allocation for lean local inference.
  #
  # 8 GiB WSL2 ceiling (bf16, max_model_len 8192): dense models up to ~1.5B work reliably.
  # Larger / hybrid models (Qwen3.5 Mamba, 3B+, 8B) need more VRAM or quantization.
  #
  # qwen2.5-7b-awq below is a 4-bit (AWQ) quantized variant sized for the 12GB VRAM tier
  # (see config/vram_tiers.yaml) — weight sizing accounts for the "awq" quantization
  # field via utils/vllm_pool_config.py's quant-aware bytes/param lookup. It is not part
  # of INFERENCE_X_LOADED_MODELS by default and does not fit the 6GB dev tier alongside
  # the other models here; load it standalone on 12GB+ hardware to exercise the quant path.

  - name: opt-125m
    engine: vllm
    model_path: facebook/opt-125m
    gpu_memory_utilization: auto
    max_model_len: 2048
    max_completion_tokens: 256
    instruction_tuned: false
    repetition_penalty: 1.15

  - name: qwen2.5-0.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-0.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: tinyllama-chat
    engine: vllm
    model_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    gpu_memory_utilization: auto
    max_model_len: 2048

  - name: qwen2.5-1.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-1.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: minicpm5-1b
    engine: vllm
    model_path: openbmb/MiniCPM5-1B
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: qwen2.5-7b-awq
    engine: vllm
    model_path: Qwen/Qwen2.5-7B-Instruct-AWQ
    quantization: awq
    gpu_memory_utilization: auto
    max_model_len: 4096
