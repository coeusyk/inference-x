models:
  # gpu_memory_utilization: auto — (vram_free - buffer) / vram_total at startup (DEC-035).
  # max_model_len caps KV cache pre-allocation for lean local inference.
  #
  # 8 GiB WSL2 ceiling (bf16, max_model_len 8192): dense models up to ~2B benchmarked
  # working reliably (qwen1.5-1.8b: 73.6 tok/s, 5.71 GiB peak VRAM delta, 2026-07-02,
  # after the auto-sizing fix below). 3B+ dense bf16 or 7B+ needs more VRAM or quantization.
  #
  # qwen2.5-7b-bf16 / qwen2.5-7b-awq below share family: qwen2.5-7b — same logical
  # model at two precisions, grouped for routing/variant_selector.py's load-time
  # selection (add-model-variant-routing). Setting INFERENCE_X_LOADED_MODELS=qwen2.5-7b
  # picks whichever variant's estimated weight size fits the resolved VRAM tier's
  # budget (bf16 preferred, falling back to awq). Neither is part of
  # INFERENCE_X_LOADED_MODELS by default. qwen2.5-7b-bf16 needs ~13 GiB weights alone,
  # doesn't fit 8 GiB. qwen2.5-7b-awq initially FAILED to load in practice (2026-07-02):
  # estimate_weight_gib() applied the AWQ quant ratio uniformly to all parameters, but
  # AWQ leaves the embedding + lm_head layers unquantized (fp16) — Qwen2.5-7B has untied
  # embeddings (tie_word_embeddings=False) and a 152k vocab, so those two layers alone
  # are ~1.1B unquantized params (~2 GiB) the estimate missed (5.29 GiB actual vs. ~3.6
  # GiB estimated). Fixed in utils/vllm_pool_config.py: estimate_weight_gib() now prices
  # embedding/lm_head params at bf16 separately from the rest. Not yet re-validated with
  # a live load on this hardware — re-run the qwen2.5-7b-awq benchmark to confirm before
  # relying on it for an 8 GiB budget.

  - name: opt-125m
    engine: vllm
    model_path: facebook/opt-125m
    gpu_memory_utilization: auto
    max_model_len: 2048
    max_completion_tokens: 256
    instruction_tuned: false
    repetition_penalty: 1.15

  - name: qwen2.5-0.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-0.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: tinyllama-chat
    engine: vllm
    model_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    gpu_memory_utilization: auto
    max_model_len: 2048

  - name: qwen2.5-1.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-1.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  # V1-0 Aider acceptance model. Trades concurrency for context (DEC-064):
  # 8192 x 1 sequence stays inside the 6gb tier's 2048 x 4 envelope, so Aider's
  # ~5k-token system prompt + repo map fits on a 6 GiB laptop.
  - name: qwen2.5-coder-1.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192
    max_num_seqs: 1

  # Continue acceptance model (add-streaming-tool-calling, DEC-065). Chosen on
  # measured Continue edits against vLLM's reference server: 3/3, where the 1.5B
  # coder model made 0/6 (no <tool_call> output) and qwen2.5-7b-awq made 1/6.
  # tool_call_parser declares the capability; without it tool requests are
  # rejected. Same 8192 x 1 envelope as the Aider model (DEC-064).
  - name: qwen3-4b-fp8
    engine: vllm
    model_path: Qwen/Qwen3-4B-Instruct-2507-FP8
    quantization: fp8
    # Explicit rather than auto on the 8 GiB RTX 4060: footprint auto-sizing asked
    # for 0.911 (7.28 GiB) from free VRAM measured before the engine process's own
    # CUDA context existed, and vLLM then saw only 6.93 GiB free and refused to start.
    gpu_memory_utilization: 0.85
    max_model_len: 8192
    max_num_seqs: 1
    tool_call_parser: hermes
    # Client-facing alias for Continue. Continue CLI 1.5.47 offers its MultiEdit tool
    # (a nested `edits` array) to any model whose name matches /qwen/ and its flat Edit
    # tool otherwise; this model malformed the MultiEdit JSON on every first attempt.
    # The alias routes here; resolved.model and the manifest still say qwen3-4b-fp8.
    aliases: [local-4b]

  - name: minicpm5-1b
    engine: vllm
    model_path: openbmb/MiniCPM5-1B
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: qwen1.5-1.8b
    engine: vllm
    model_path: Qwen/Qwen1.5-1.8B-Chat
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: qwen2.5-7b-bf16
    engine: vllm
    model_path: Qwen/Qwen2.5-7B-Instruct
    family: qwen2.5-7b
    gpu_memory_utilization: auto
    max_model_len: 4096

  - name: qwen2.5-7b-awq
    engine: vllm
    model_path: Qwen/Qwen2.5-7B-Instruct-AWQ
    quantization: awq
    family: qwen2.5-7b
    gpu_memory_utilization: auto
    max_model_len: 4096

  # llama.cpp entries (add-llama-cpp-backend): served by an external llama-server
  # (INFERENCE_X_LLAMA_SERVER or llama-server on PATH), one sequence per process.
  # The GGUF file downloads into the Hugging Face cache on first start. vLLM-only
  # fields (gpu_memory_utilization, quantization, ...) are rejected on these entries;
  # llama-server fits the GPU layers itself unless n_gpu_layers is set.
  - name: qwen2.5-0.5b-gguf
    engine: llama_cpp
    model_path: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    gguf_file: qwen2.5-0.5b-instruct-q4_k_m.gguf
    max_model_len: 8192

  - name: qwen2.5-coder-7b-gguf
    engine: llama_cpp
    model_path: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF
    gguf_file: qwen2.5-coder-7b-instruct-q4_k_m.gguf
    max_model_len: 8192
