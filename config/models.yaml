models:
  # gpu_memory_utilization: auto — (vram_free - buffer) / vram_total at startup (DEC-035).
  # max_model_len caps KV cache pre-allocation for lean local inference.

  - name: opt-125m
    engine: vllm
    model_path: facebook/opt-125m
    gpu_memory_utilization: auto
    max_model_len: 2048

  - name: qwen2.5-0.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-0.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: tinyllama-chat
    engine: vllm
    model_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    gpu_memory_utilization: auto
    max_model_len: 2048

  - name: qwen2.5-1.5b
    engine: vllm
    model_path: Qwen/Qwen2.5-1.5B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: minicpm5-1b
    engine: vllm
    model_path: openbmb/MiniCPM5-1B
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: qwen2.5-3b
    engine: vllm
    model_path: Qwen/Qwen2.5-3B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 8192

  - name: minicpm3-4b
    engine: vllm
    model_path: openbmb/MiniCPM3-4B
    gpu_memory_utilization: auto
    max_model_len: 8192

  # fp16 weights ~16 GB — needs quantization on 8 GB GPUs (separate issue)
  - name: llama3-8b
    engine: vllm
    model_path: meta-llama/Meta-Llama-3-8B-Instruct
    gpu_memory_utilization: auto
    max_model_len: 4096
    gated: true
