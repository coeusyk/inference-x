tiers:
  # Tiers are matched by probed total VRAM (profile_hardware().vram_total_gb) against
  # min_vram_gb, picking the highest tier whose floor the GPU clears. A GPU below every
  # floor still gets the lowest ("6gb") tier — never guess a higher/less-safe tier when
  # detection is uncertain; vram_tiers.resolve_tier() logs a warning in that case.
  #
  # gpu_memory_utilization_ceiling is a hard cap layered on top of the existing
  # auto-sizing in utils/vllm_pool_config.py (which already computes a value from
  # probed free/total VRAM) — it exists to keep a fixed safety margin per tier
  # regardless of what auto-sizing alone would allow.
  #
  # max_num_seqs / max_model_len_cap bound the worst case
  # (max_model_len * max_num_seqs * kv_bytes_per_token) against real KV-cache VRAM —
  # see estimate_kv_cache_gib() in utils/vllm_pool_config.py.
  #
  # block_size / kv_cache_dtype are vLLM PagedAttention knobs, not yet consumed by the
  # engine (surfacing them is Phase 2 work) — recorded here now so the tier contract is
  # complete and the values are ready to wire in without a config-schema change.

  - name: 6gb
    min_vram_gb: 0
    description: >
      Dev/laptop tier (e.g. RTX 3060 Laptop 6GB, the box this repo is developed on).
      Fits dense models up to ~3B in bf16, or a single 4-bit (AWQ/GPTQ) ~7B model at a
      short context. Default/fallback tier when a GPU can't be matched to a higher tier.
    gpu_memory_utilization_ceiling: 0.90
    max_model_len_cap: 2048
    max_num_seqs: 4
    block_size: 16
    kv_cache_dtype: auto

  - name: 12gb
    min_vram_gb: 10
    description: >
      Mid-range consumer GPU (e.g. RTX 3060/4070 12GB). Fits a 4-bit ~7B model at 4k
      context, or a bf16 ~7B model with a tighter context ceiling.
    gpu_memory_utilization_ceiling: 0.90
    max_model_len_cap: 4096
    max_num_seqs: 8
    block_size: 16
    kv_cache_dtype: auto

  - name: 24gb
    min_vram_gb: 20
    description: >
      High-end consumer / workstation GPU (e.g. RTX 3090/4090 24GB). Fits a bf16 ~7B
      model at 8k context, or a 4-bit ~32B model at 4k context.
    gpu_memory_utilization_ceiling: 0.92
    max_model_len_cap: 8192
    max_num_seqs: 16
    block_size: 16
    kv_cache_dtype: auto
