[project]
name = "inferencex"
version = "0.1.0"
description = "Self-hosted LLM inference platform with smart routing and observability"
requires-python = ">=3.13"
dependencies = [
    "vllm>=0.6.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.32.0",
    "rich>=13.0",
    "textual>=8.2,<9",
]

[project.optional-dependencies]
hardware = ["nvidia-ml-py>=12.0", "psutil>=5.9"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-repeat>=0.9.3",
    "httpx2>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # SWIG bindings in torch/vllm (Python 3.13+)
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    # WSL / CPU-only test hosts without NVML
    "ignore:Can't initialize NVML:UserWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_x"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"