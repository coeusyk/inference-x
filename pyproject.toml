[project]
name = "inferencex"
version = "0.1.0"
description = "Self-hosted LLM inference platform with smart routing and observability"
requires-python = ">=3.13"
dependencies = [
    "vllm>=0.6.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.32.0",
    "rich>=13.0",
    "textual>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:starlette"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_x"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
